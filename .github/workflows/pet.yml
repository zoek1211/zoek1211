name: My YourTomo cat
on:
  schedule:
    - cron: '23 * * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zoek1211/YourTomo@main
        with:
          username: zoek1211
          timezone-offset-minutes: "540" # KST (UTC+9)
